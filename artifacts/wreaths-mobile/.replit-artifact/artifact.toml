kind = "mobile"
previewPath = "/mobile/"
title = "Debbie's Wreaths — Mobile"
version = "1.0.0"
id = "artifacts/wreaths-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24454

[services.development]
run = "pnpm --filter @workspace/wreaths-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wreaths-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wreaths-mobile", "run", "serve" ]

[services.env]
PORT = "24454"
BASE_PATH = "/mobile/"
