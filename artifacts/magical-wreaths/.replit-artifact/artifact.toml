kind = "web"
previewPath = "/"
title = "Debbie's Magical Wreaths"
version = "1.0.0"
id = "artifacts/magical-wreaths"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25584

[services.development]
run = "pnpm --filter @workspace/magical-wreaths run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/magical-wreaths", "run", "build" ]
publicDir = "artifacts/magical-wreaths/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25584"
BASE_PATH = "/"
